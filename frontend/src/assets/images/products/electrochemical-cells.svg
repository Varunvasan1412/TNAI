  <rect x="171" y="213" width="38" height="24" rx="4" fill="rgba(46,139,116,0.3)"/>
  <!-- Electrodes in cells -->
  <rect x="118" y="145" width="8" height="140" rx="4" fill="url(#acc)" opacity="0.8"/>
  <rect x="254" y="145" width="8" height="140" rx="4" fill="url(#acc)" opacity="0.8"/>
  <!-- Ports on top -->
  <rect x="110" y="118" width="20" height="16" rx="4" fill="url(#acc)" opacity="0.7"/>
  <rect x="250" y="118" width="20" height="16" rx="4" fill="url(#acc)" opacity="0.7"/>
  <!-- Labels -->
  <text x="125" y="365" text-anchor="middle" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.7)">Working</text>
  <text x="255" y="365" text-anchor="middle" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.7)">Counter</text>
  <text x="190" y="395" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(123,191,63,0.8)">H-Type Cell</text>
  <!-- Bubbles -->
  <circle cx="105" cy="280" r="5" fill="rgba(255,255,255,0.1)"/>
  <circle cx="245" cy="260" r="4" fill="rgba(255,255,255,0.1)"/>
  <text x="190" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Electrochemical Cells</text>
  <text x="190" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="rgba(123,191,63,0.9)">H-Type · Flow · 3-Neck · 5-Neck</text>
