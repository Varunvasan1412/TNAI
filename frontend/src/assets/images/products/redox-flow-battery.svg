<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381 585" width="381" height="585">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#141e30"/><stop offset="100%" style="stop-color:#243b55"/></linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#7BBF3F"/><stop offset="100%" style="stop-color:#2E8B74"/></linearGradient>
  </defs>
  <rect width="381" height="585" fill="url(#bg)"/>
  <!-- Left tank -->
  <rect x="50" y="120" width="90" height="130" rx="8" fill="rgba(123,191,63,0.2)" stroke="url(#acc)" stroke-width="2.5"/>
  <rect x="55" y="200" width="80" height="46" rx="4" fill="rgba(123,191,63,0.35)"/>
  <text x="95" y="168" text-anchor="middle" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.8)">Anolyte</text>
  <text x="95" y="186" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(123,191,63,0.8)">Tank</text>
  <!-- Right tank -->
  <rect x="240" y="120" width="90" height="130" rx="8" fill="rgba(46,139,116,0.2)" stroke="url(#acc)" stroke-width="2.5"/>
  <rect x="245" y="200" width="80" height="46" rx="4" fill="rgba(46,139,116,0.35)"/>
  <text x="285" y="168" text-anchor="middle" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.8)">Catholyte</text>
  <text x="285" y="186" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(46,139,116,0.8)">Tank</text>
  <!-- Cell stack center -->
  <rect x="155" y="130" width="70" height="110" rx="6" fill="rgba(255,255,255,0.06)" stroke="url(#acc)" stroke-width="3"/>
  <rect x="160" y="140" width="20" height="90" rx="3" fill="rgba(123,191,63,0.3)"/>
  <rect x="200" y="140" width="20" height="90" rx="3" fill="rgba(46,139,116,0.3)"/>
  <rect x="183" y="148" width="14" height="74" rx="2" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="190" y="255" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)">Cell Stack</text>
  <!-- Flow arrows top (pump) -->
  <path d="M140 115 L155 115" stroke="url(#acc)" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M225 115 L240 115" stroke="url(#acc)" stroke-width="2"/>
  <!-- Pump circles -->
  <circle cx="128" cy="115" r="12" fill="none" stroke="url(#acc)" stroke-width="2"/>
  <text x="128" y="119" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(123,191,63,0.9)">P</text>
  <circle cx="252" cy="115" r="12" fill="none" stroke="url(#acc)" stroke-width="2"/>
  <text x="252" y="119" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(46,139,116,0.9)">P</text>
  <!-- Connecting lines -->
  <line x1="95" y1="115" x2="116" y2="115" stroke="url(#acc)" stroke-width="2"/>
  <line x1="140" y1="115" x2="155" y2="130" stroke="url(#acc)" stroke-width="2"/>
  <line x1="225" y1="130" x2="240" y2="115" stroke="url(#acc)" stroke-width="2"/>
  <line x1="264" y1="115" x2="285" y2="115" stroke="url(#acc)" stroke-width="2"/>
  <!-- Return lines bottom -->
  <line x1="95" y1="250" x2="95" y2="280" stroke="url(#acc)" stroke-width="2"/>
  <line x1="95" y1="280" x2="285" y2="280" stroke="url(#acc)" stroke-width="2"/>
  <line x1="285" y1="250" x2="285" y2="280" stroke="url(#acc)" stroke-width="2"/>
  <line x1="155" y1="240" x2="155" y2="280" stroke="url(#acc)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="225" y1="240" x2="225" y2="280" stroke="url(#acc)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Load/power output -->
  <rect x="155" y="310" width="70" height="40" rx="6" fill="url(#acc)" opacity="0.5"/>
  <text x="190" y="335" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">LOAD</text>
  <line x1="163" y1="240" x2="163" y2="310" stroke="url(#acc)" stroke-width="2"/>
  <line x1="217" y1="240" x2="217" y2="310" stroke="url(#acc)" stroke-width="2"/>
  <!-- Labels -->
  <text x="190" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.7)">Vanadium / Iron-Chromium</text>
  <text x="190" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">Redox Flow Battery</text>
  <text x="190" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="rgba(123,191,63,0.9)">Cells · Frames · Gaskets · Pumps</text>
</svg>