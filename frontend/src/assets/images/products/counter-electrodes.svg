<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381 585" width="381" height="585">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#141e30"/><stop offset="100%" style="stop-color:#243b55"/></linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#7BBF3F"/><stop offset="100%" style="stop-color:#2E8B74"/></linearGradient>
  </defs>
  <rect width="381" height="585" fill="url(#bg)"/>
  <!-- Platinum mesh grid -->
  <g opacity="0.8">
    <rect x="120" y="100" width="140" height="180" rx="4" fill="none" stroke="url(#acc)" stroke-width="2.5"/>
    <line x1="120" y1="127" x2="260" y2="127" stroke="url(#acc)" stroke-width="1.5"/>
    <line x1="120" y1="154" x2="260" y2="154" stroke="url(#acc)" stroke-width="1.5"/>
    <line x1="120" y1="181" x2="260" y2="181" stroke="url(#acc)" stroke-width="1.5"/>
    <line x1="120" y1="208" x2="260" y2="208" stroke="url(#acc)" stroke-width="1.5"/>
    <line x1="120" y1="235" x2="260" y2="235" stroke="url(#acc)" stroke-width="1.5"/>
    <line x1="120" y1="262" x2="260" y2="262" stroke="url(#acc)" stroke-width="1.5"/>
    <line x1="148" y1="100" x2="148" y2="280" stroke="url(#acc)" stroke-width="1.5"/>
    <line x1="176" y1="100" x2="176" y2="280" stroke="url(#acc)" stroke-width="1.5"/>
    <line x1="204" y1="100" x2="204" y2="280" stroke="url(#acc)" stroke-width="1.5"/>
    <line x1="232" y1="100" x2="232" y2="280" stroke="url(#acc)" stroke-width="1.5"/>
  </g>
  <!-- Wire handle -->
  <rect x="184" y="60" width="12" height="44" rx="4" fill="url(#acc)"/>
  <circle cx="190" cy="52" r="10" fill="url(#acc)"/>
  <!-- Pt label -->
  <rect x="152" y="300" width="76" height="28" rx="6" fill="url(#acc)" opacity="0.7"/>
  <text x="190" y="319" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">Pt Mesh</text>
  <!-- Graphite rod alternative -->
  <rect x="155" y="360" width="14" height="100" rx="7" fill="rgba(100,100,100,0.7)"/>
  <rect x="212" y="360" width="14" height="100" rx="7" fill="rgba(100,100,100,0.7)"/>
  <text x="162" y="480" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.6)">Graphite</text>
  <text x="219" y="480" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.6)">Rod</text>
  <text x="190" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Counter Electrodes</text>
  <text x="190" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="rgba(123,191,63,0.9)">Platinum · Graphite · Carbon</text>
</svg>