  <rect x="85" y="410" width="28" height="50" rx="4" fill="rgba(123,191,63,0.3)" stroke="url(#acc)" stroke-width="1.5"/>
  <rect x="111" y="410" width="28" height="50" rx="4" fill="rgba(46,139,116,0.3)" stroke="url(#acc)" stroke-width="1.5"/>
  <rect x="137" y="410" width="28" height="50" rx="4" fill="rgba(123,191,63,0.3)" stroke="url(#acc)" stroke-width="1.5"/>
  <rect x="163" y="410" width="28" height="50" rx="4" fill="rgba(46,139,116,0.3)" stroke="url(#acc)" stroke-width="1.5"/>
  <text x="190" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">Battery Testing Solutions</text>
  <text x="190" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="rgba(123,191,63,0.9)">Multi-Channel Cyclers · High Current</text>
