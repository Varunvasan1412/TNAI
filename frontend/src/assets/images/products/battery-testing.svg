<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381 585" width="381" height="585">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#141e30"/><stop offset="100%" style="stop-color:#243b55"/></linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#7BBF3F"/><stop offset="100%" style="stop-color:#2E8B74"/></linearGradient>
  </defs>
  <rect width="381" height="585" fill="url(#bg)"/>
  <!-- Device chassis -->
  <rect x="70" y="90" width="240" height="280" rx="12" fill="rgba(255,255,255,0.05)" stroke="url(#acc)" stroke-width="3"/>
  <!-- Screen -->
  <rect x="90" y="110" width="200" height="120" rx="6" fill="rgba(46,139,116,0.2)" stroke="url(#acc)" stroke-width="1.5"/>
