  <rect x="142" y="245" width="44" height="30" rx="4" fill="rgba(46,139,116,0.3)" stroke="url(#acc)" stroke-width="1"/>
  <text x="164" y="264" text-anchor="middle" font-family="Arial" font-size="11" fill="white">CH2</text>
  <rect x="194" y="245" width="44" height="30" rx="4" fill="rgba(123,191,63,0.3)" stroke="url(#acc)" stroke-width="1"/>
  <text x="216" y="264" text-anchor="middle" font-family="Arial" font-size="11" fill="white">CH3</text>
  <rect x="246" y="245" width="44" height="30" rx="4" fill="rgba(46,139,116,0.3)" stroke="url(#acc)" stroke-width="1"/>
  <text x="268" y="264" text-anchor="middle" font-family="Arial" font-size="11" fill="white">CH4</text>
  <!-- Buttons -->
  <circle cx="105" cy="325" r="12" fill="url(#acc)" opacity="0.7"/>
  <circle cx="145" cy="325" r="12" fill="rgba(255,255,255,0.1)" stroke="url(#acc)" stroke-width="1.5"/>
  <circle cx="185" cy="325" r="12" fill="rgba(255,255,255,0.1)" stroke="url(#acc)" stroke-width="1.5"/>
  <rect x="220" y="312" width="70" height="26" rx="6" fill="url(#acc)" opacity="0.7"/>
  <text x="255" y="329" text-anchor="middle" font-family="Arial" font-size="12" fill="white">START</text>
  <!-- Connectors on bottom -->
  <rect x="90" y="355" width="18" height="10" rx="2" fill="url(#acc)" opacity="0.6"/>
  <rect x="116" y="355" width="18" height="10" rx="2" fill="url(#acc)" opacity="0.6"/>
  <rect x="142" y="355" width="18" height="10" rx="2" fill="url(#acc)" opacity="0.6"/>
  <rect x="168" y="355" width="18" height="10" rx="2" fill="url(#acc)" opacity="0.6"/>
  <!-- Wires going down -->
  <line x1="99" y1="365" x2="99" y2="410" stroke="#7BBF3F" stroke-width="2"/>
  <line x1="125" y1="365" x2="125" y2="410" stroke="#2E8B74" stroke-width="2"/>
