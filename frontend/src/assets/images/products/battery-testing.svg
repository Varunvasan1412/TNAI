  <line x1="100" y1="225" x2="285" y2="225" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="100" y1="115" x2="100" y2="225" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Channel indicators -->
