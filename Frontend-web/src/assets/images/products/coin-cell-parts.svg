<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381 585" width="381" height="585">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#141e30"/><stop offset="100%" style="stop-color:#243b55"/></linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#7BBF3F"/><stop offset="100%" style="stop-color:#2E8B74"/></linearGradient>
  </defs>
  <rect width="381" height="585" fill="url(#bg)"/>
  <!-- Coin cell stack exploded view -->
  <!-- Top cap -->
  <ellipse cx="190" cy="120" rx="80" ry="18" fill="none" stroke="url(#acc)" stroke-width="3"/>
  <path d="M110 120 Q110 140 190 145 Q270 140 270 120" fill="rgba(46,139,116,0.3)" stroke="url(#acc)" stroke-width="2"/>
  <text x="190" y="138" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)">Cap (+)</text>
  <!-- Gasket -->
  <ellipse cx="190" cy="175" rx="80" ry="12" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="190" y="172" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.5)">Gasket</text>
  <!-- Cathode -->
  <ellipse cx="190" cy="220" rx="70" ry="14" fill="rgba(123,191,63,0.3)" stroke="url(#acc)" stroke-width="2.5"/>
  <text x="190" y="224" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Cathode</text>
  <!-- Separator -->
  <ellipse cx="190" cy="268" rx="65" ry="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <text x="190" y="272" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.6)">Separator</text>
  <!-- Anode -->
  <ellipse cx="190" cy="314" rx="70" ry="14" fill="rgba(46,139,116,0.3)" stroke="url(#acc)" stroke-width="2.5"/>
  <text x="190" y="318" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Anode</text>
  <!-- Base -->
  <ellipse cx="190" cy="362" rx="80" ry="18" fill="none" stroke="url(#acc)" stroke-width="3"/>
  <path d="M110 362 Q110 382 190 387 Q270 382 270 362" fill="rgba(46,139,116,0.2)" stroke="url(#acc)" stroke-width="2"/>
  <text x="190" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)">Base (−)</text>
  <!-- Assembled coin cell on side -->
  <ellipse cx="190" cy="435" rx="40" ry="9" fill="url(#acc)" opacity="0.6"/>
  <rect x="150" y="435" width="80" height="18" fill="url(#acc)" opacity="0.5"/>
  <ellipse cx="190" cy="453" rx="40" ry="9" fill="url(#acc)" opacity="0.6"/>
  <text x="190" y="480" text-anchor="middle" font-family="Arial" font-size="13" fill="rgba(255,255,255,0.7)">CR2032 / CR2016</text>
  <text x="190" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Coin Cell Parts</text>
  <text x="190" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="rgba(123,191,63,0.9)">Cases · Spacers · Springs · Gaskets</text>
</svg>