<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381 585" width="381" height="585">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141e30"/><stop offset="100%" style="stop-color:#243b55"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7BBF3F"/><stop offset="100%" style="stop-color:#2E8B74"/>
    </linearGradient>
  </defs>
  <rect width="381" height="585" fill="url(#bg)"/>
  <!-- Glass tube body -->
  <rect x="168" y="70" width="44" height="280" rx="22" fill="none" stroke="url(#acc)" stroke-width="3"/>
  <rect x="174" y="76" width="32" height="268" rx="16" fill="rgba(46,139,116,0.15)"/>
  <!-- Internal filling (KCl solution) -->
  <rect x="176" y="160" width="28" height="180" rx="8" fill="rgba(123,191,63,0.25)"/>
  <!-- Ag/AgCl wire inside -->
  <rect x="188" y="90" width="4" height="240" rx="2" fill="url(#acc)" opacity="0.8"/>
  <!-- Junction tip -->
  <path d="M168 350 L190 390 L212 350 Z" fill="url(#acc)" opacity="0.7"/>
  <!-- Label band -->
  <rect x="163" y="195" width="54" height="22" rx="4" fill="url(#acc)" opacity="0.6"/>
  <text x="190" y="211" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">Ag/AgCl</text>
  <!-- Top cap -->
  <rect x="164" y="58" width="52" height="18" rx="6" fill="url(#acc)"/>
  <!-- Connector wire -->
  <line x1="190" y1="58" x2="190" y2="40" stroke="#7BBF3F" stroke-width="3"/>
  <circle cx="190" cy="36" r="6" fill="#7BBF3F"/>
  <!-- Bubbles -->
  <circle cx="182" cy="200" r="4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="196" cy="230" r="3" fill="rgba(255,255,255,0.1)"/>
  <circle cx="184" cy="260" r="5" fill="rgba(255,255,255,0.12)"/>
  <text x="190" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Reference Electrodes</text>
  <text x="190" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="rgba(123,191,63,0.9)">Ag/AgCl · Calomel · Hg/HgO</text>
</svg>